; CareTwin firmware: pulseira com ESP32-S3, MPU-6050, MAX30102, display e bateria LiPo
;   pio run -e wokwi        compila para o simulador Wokwi (nao precisa de placa)
;   pio test -e native      roda os testes do nucleo no computador (nao precisa de placa)
;   pio run -e real         compila para a placa de verdade (ainda nao testado)

[platformio]
default_envs = wokwi

[env:wokwi]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit MPU6050@^2.2.6
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ILI9341@^1.6.0
build_flags =
  -DCT_SIM=1
  -DCT_FW_VERSION=\"0.2.0-sim\"

; Ambiente para quando as pecas chegarem. NAO foi compilado nem testado: so o ambiente wokwi e
; o codigo da simulacao foram validados. Ajuste aqui se o PlatformIO reclamar.
[env:real]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit MPU6050@^2.2.6
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ST7789 Library@^1.10.4
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
build_flags =
  -DCT_SIM=0
  -DCT_FW_VERSION=\"0.2.0-real\"

; Testes unitarios do nucleo (lib/caretwin_core) rodando no PC
[env:native]
platform = native
test_framework = unity
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -std=gnu++17
