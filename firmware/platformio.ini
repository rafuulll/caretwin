; CareTwin firmware: pulseira com ESP32-S3, MPU-6050, MAX30102, display e bateria LiPo
;   pio run -e wokwi        compila para o simulador Wokwi (nao precisa de placa)
;   pio test -e native      roda os testes do nucleo no computador (nao precisa de placa)
;   pio run -e real         compila para a placa de verdade (ainda nao testado)

[platformio]
default_envs = wokwi

[env:wokwi]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit MPU6050@^2.2.6
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ILI9341@^1.6.0
build_flags =
  -DCT_SIM=1
  -DCT_FW_VERSION=\"0.2.0-sim\"

; Ambiente para quando as pecas chegarem. NAO foi compilado nem testado: so o ambiente wokwi e
; o codigo da simulacao foram validados. Ajuste aqui se o PlatformIO reclamar.
[env:real]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit MPU6050@^2.2.6
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
build_flags =
  -DCT_SIM=0
  -DCT_FW_VERSION=\"0.2.0-real\"

; Testes unitarios do nucleo (lib/caretwin_core) rodando no PC
[env:native]
platform = native
test_framework = unity
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -std=gnu++17

; Teste de bancada: so display e botoes (nao roda o firmware da pulseira).
;   pio run -e teste_hw -t upload
; Se a imagem do display sair torta, use o ambiente teste_hw_modo3.
[env:teste_hw]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<../teste_hardware/teste_display_botao.cpp>
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

[env:teste_hw_modo3]
extends = env:teste_hw
build_flags =
  -DTEST_SPI_MODE=SPI_MODE3

; Teste de bancada: MPU-6050 e MAX30102 no I2C (nao roda o firmware da pulseira).
;   pio run -e teste_sensores -t upload
[env:teste_sensores]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<../teste_hardware/teste_sensores.cpp>
