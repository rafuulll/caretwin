name: 'Bateria simulada: 100% e 0%'
version: 1
author: 'CareTwin'

steps:
  - wait-serial: '[READY] aquisicao iniciada'
  - set-control:
      part-id: pot1
      control: position
      value: 1
  - delay: 300ms
  - write-serial: "Q\n"
  - wait-serial: 'bateria_agora=100 '
  - set-control:
      part-id: pot1
      control: position
      value: 0
  - delay: 300ms
  - write-serial: "Q\n"
  - wait-serial: 'bateria_agora=0 '
